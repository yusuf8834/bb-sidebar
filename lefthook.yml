pre-commit:
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,graphql,gql,html}"
      run: npx --no-install @biomejs/biome check --no-errors-on-unmatched {staged_files}
    import-boundaries:
      glob: "*.{ts,tsx}"
      run: node scripts/check-import-boundaries.mjs {staged_files}
    file-sizes:
      run: node scripts/check-file-sizes.mjs

commit-msg:
  commands:
    strip-ai-attribution:
      run: node scripts/strip-ai-attribution.mjs {1}

pre-push:
  commands:
    check:
      run: npm run check
